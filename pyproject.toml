[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sway-commerce"
version = "0.1.0"
description = "Skincare conversational commerce demo with explicit consent and TAP-shaped verification"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=45.0.0",
  "fastapi>=0.116.0",
  "httpx>=0.28.0",
  "joserfc>=1.0.0",
  "openai>=1.99.0",
  "openpyxl>=3.1.5",
  "python-multipart>=0.0.20",
  "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
  "ruff>=0.12.0",
]

[tool.setuptools]
packages = ["app", "agent", "merchant", "payments", "seed"]


[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
